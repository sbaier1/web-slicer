version: '3.8'

services:
  orcaweb:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    image: ghcr.io/sbaier1/web-slicer:latest
    container_name: orcaweb
    ports:
      - "3000:80"
      - "8080:8080"
    restart: unless-stopped
    environment:
      - PORT=8080
      - FLASK_ENV=production
      # - KLIPPER_URL=http://10.8.0.105:7125
    volumes:
      # Optional: Mount custom default slicing profile settings JSON for empty browser sessions
      # - ./my_defaults.json:/app/default_settings.json
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
